apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-web
  template:
    metadata:
      labels:
        app: python-web
    spec:
      containers:
        - name: python-web
          image: simple-python-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: python-web
spec:
  type: NodePort
  selector:
    app: python-web
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
