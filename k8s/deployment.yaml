apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-docker-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-docker-app
  template:
    metadata:
      labels:
        app: python-docker-app
    spec:
      containers:
        - name: app
          image: sagarsharma2118/python-docker-app:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: python-docker-app
spec:
  selector:
    app: python-docker-app
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP
